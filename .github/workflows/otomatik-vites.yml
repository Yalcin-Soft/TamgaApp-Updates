name: Otomatik Vites (Derleme, Imzalama Ozeti ve Yayinlama)

# Tek tıkla yeni sürüm: Actions > "Otomatik Vites" > Run workflow
#  1) AssemblyInfo sürümünü girilen numaraya ayarlar (uygulamanın kendini tanıdığı sürüm)
#  2) Release/x64 derler ve ZIP paketler
#  3) Paketin SHA-256 özetini hesaplar
#  4) update.xml'i (sürüm, indirme adresi, özet, zorunluluk) otomatik yazar
#  5) GitHub Release oluşturur ve update.xml + AssemblyInfo değişikliğini main'e geri işler
# Uygulama update.xml'deki özetle indirdiği paketi doğrular; bozuk/değiştirilmiş paket kurulmaz.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Yeni sürüm numarası (ör. 2.1.0.0)'
        required: true
        default: '2.1.0.0'
      notlar:
        description: 'Sürüm notları (bu sürümde neler var?)'
        required: false
        default: 'Hata düzeltmeleri ve iyileştirmeler.'
      zorunlu:
        description: 'Zorunlu güncelleme mi? (kullanıcı ertelemez)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 📥 Kodu Çek
      uses: actions/checkout@v4

    - name: 🔢 Sürüm Numarasını Doğrula
      shell: pwsh
      run: |
        if ('${{ github.event.inputs.version }}' -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Sürüm biçimi 1.2.3.4 olmalı" }

    - name: 🏷️ AssemblyInfo Sürümünü Ayarla
      shell: pwsh
      run: |
        $v = '${{ github.event.inputs.version }}'
        $f = 'TamgaApp/Properties/AssemblyInfo.cs'
        $t = Get-Content $f -Raw
        $t = $t -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$v`")"
        $t = $t -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$v`")"
        Set-Content $f $t -Encoding utf8

    - name: 🛠️ MSBuild Motorunu Kur
      uses: microsoft/setup-msbuild@v2

    - name: 📦 NuGet Kur
      uses: NuGet/setup-nuget@v2

    - name: 🔄 Paketleri Geri Yükle
      run: nuget restore TamgaApp\TamgaApp.csproj -PackagesDirectory packages

    - name: 🚀 Projeyi Derle (Release / x64)
      run: msbuild TamgaApp\TamgaApp.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal

    - name: 🗜️ Paketle ve SHA-256 Özetini Hesapla
      id: paket
      shell: pwsh
      run: |
        $v = '${{ github.event.inputs.version }}'
        $zip = "TamgaApp_Guncelleme_v$v.zip"
        Compress-Archive -Path "TamgaApp\bin\x64\Release\*" -DestinationPath $zip -Force
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
        "zip=$zip" >> $env:GITHUB_OUTPUT
        "hash=$hash" >> $env:GITHUB_OUTPUT
        Write-Host "SHA-256: $hash"

    - name: 📝 update.xml Dosyasını Yaz
      shell: pwsh
      run: |
        $v = '${{ github.event.inputs.version }}'
        $repo = '${{ github.repository }}'
        $zorunlu = if ('${{ github.event.inputs.zorunlu }}' -eq 'true') { 'true' } else { 'false' }
        $satirlar = @(
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<item>',
          "  <version>$v</version>",
          "  <url>https://github.com/$repo/releases/download/v$v/${{ steps.paket.outputs.zip }}</url>",
          "  <changelog>https://github.com/$repo/releases/tag/v$v</changelog>",
          "  <mandatory>$zorunlu</mandatory>",
          '  <checksum algorithm="SHA256">${{ steps.paket.outputs.hash }}</checksum>',
          '</item>'
        )
        Set-Content 'TamgaApp/update.xml' ($satirlar -join "`n") -Encoding utf8

    - name: 🏆 GitHub Release Oluştur
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: TamgaApp v${{ github.event.inputs.version }}
        body: |
          ${{ github.event.inputs.notlar }}

          **SHA-256:** `${{ steps.paket.outputs.hash }}`
        files: ${{ steps.paket.outputs.zip }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📤 update.xml ve Sürümü main'e İşle
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add TamgaApp/update.xml TamgaApp/Properties/AssemblyInfo.cs
        git commit -m "Sürüm v${{ github.event.inputs.version }} yayınlandı"
        git push
